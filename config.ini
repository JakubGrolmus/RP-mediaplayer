# Konfigurace media prehravace
# Po ulozeni zmen se prehravani automaticky restartuje s novymi parametry
# (neni potreba restartovat Raspberry Pi).

[source]
# Cesta k jednomu souboru NEBO k adresari (pak se prehraje playlist
# vsech podporovanych souboru v adresari, serazenych podle nazvu)
path = /media/usb0/video.mp4

# true = porad dokola opakovat (soubor, nebo cely playlist)
loop = true

# true = promichat poradi prehravani (ma smysl jen pro adresar/playlist)
shuffle = false

[video]
# Kam se ma zobrazovat obraz:
#   hdmi0 = prvni HDMI vystup
#   hdmi1 = druhy HDMI vystup
#   auto  = necha system vybrat pripojeny vystup automaticky
output = hdmi0

[audio]
# Kam se ma pustit zvuk:
#   hdmi0 = zvuk pres prvni HDMI
#   hdmi1 = zvuk pres druhy HDMI
#   jack  = analogovy 3.5mm jack
#   usb   = USB zvukova karta / adapter
#   none  = ztlumit (bez zvuku)
output = jack

# hlasitost 0-100
volume = 100
